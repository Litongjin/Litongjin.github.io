# ============================================================
# Jekyll / GitHub Pages 配置
# 推送到 GitHub 后，在仓库 Settings -> Pages 选择 main 分支根目录，
# GitHub 会自动构建并发布（无需本地安装 Ruby）。
# ============================================================
title: "我的工作台"
description: "每日待办 · 行业热点 · 技能提升"
author: "Litongjin"

# 站点地址：本项目是「用户主页仓库」(用户名.github.io)，
# 因此发布地址就是 https://litongjin.github.io/ ，无需 baseurl。
url: "https://litongjin.github.io"

# 主题：minima 是 GitHub Pages 官方支持、零配置即用的极简主题
theme: minima
markdown: kramdown
highlighter: rouge
lang: zh-CN
timezone: Asia/Shanghai

# GitHub Pages 白名单插件（直接写这里即可，无需 Gemfile 也能在 Pages 上构建）
plugins:
  - jekyll-feed        # 生成 RSS，方便订阅
  - jekyll-seo-tag     # SEO / 社交分享卡片，对简历曝光友好

show_excerpts: true

# 顶部导航
header_pages:
  - about.md

# 社交链接（填了会在页脚显示）
social_links:
  - { platform: github, user: Litongjin }
