# ============================================================
# Hexo 配置
# 由 Cloudflare Pages 构建：Build command `hexo generate`，Output `public`
# （无需本地安装 Ruby / 无需 GitHub Pages）
# ============================================================
title: 我的工作台
subtitle: ''
description: 行业热点 · 技能提升（工作总结汇总）
author: Litongjin
language: zh-CN
timezone: Asia/Shanghai

# 部署交给 Cloudflare Pages，这里不配置 deployer
deploy: {}

# 站点地址（改成你的 Cloudflare Pages 域名或自定义域名，用于绝对链接/SEO）
url: https://litongjin.github.io
root: /

# 主题
theme: butterfly

# 永久链接（ASCII 友好：文件名含日期+slug -> /2026/08/19/daily-workbench/）
permalink: :year/:month/:day/:title/

# 文章资源目录（关闭，避免每篇文章多生成一个资源文件夹）
post_asset_folder: false

# RSS 订阅
feed:
  type: atom
  path: atom.xml
  limit: 20

# 站内搜索（hexo-generator-search，配合 butterfly local_search 前端检索）
search:
  path: search.xml
  field: post
  content: true
  format: html
